[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "phyra-engine"
version = "0.1.0"
description = "Headless SI linear-static mechanics for Phyra"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "scikit-fem==12.0.2", "gmsh==4.15.2", "jsonschema==4.26.0", "torch==2.14.0", "cadquery-ocp-novtk==8.0.1.1.0", "cadquery-ocp-proxy==8.0.1.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["phyra_engine*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: mesh convergence studies requiring additional CPU time"]
