[package]
name = "phyra"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "=1.53.1", features = ["macros", "sync", "time"] }
futures-util = "=0.3.34"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
zeroize = "=1.8.2"
dirs = "=6.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
