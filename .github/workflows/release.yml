name: Prepare a verified release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-metadata.mjs
      - name: Require reviewed public distribution readiness
        env:
          DISTRIBUTION_READY: ${{ vars.PHYRA_PUBLIC_DISTRIBUTION_READY }}
        run: |
          if [ "$DISTRIBUTION_READY" != "true" ]; then
            echo "::error::Public distribution is gated. Complete target-specific redistribution/Corresponding Source, installation and trust review before the owner enables PHYRA_PUBLIC_DISTRIBUTION_READY."
            exit 1
          fi
  verified-builds:
    needs: readiness
    uses: ./.github/workflows/ci.yml
    with:
      release_assets: true
  draft:
    needs: verified-builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create draft with curated release notes, verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v target="## $version" '
            $0 == target || index($0, target " (") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Verification and distribution

          This draft is prepared from the exact tag after scientific and packaged desktop workflow checks on macOS Apple Silicon and Windows x64. Check the platform SHA256SUMS files before installing. Hosted checks do not replace consumer installation, minimum-OS or production signing review. See README.md and SECURITY.md at this tag for supported scope and distribution limits.

          The owner must review assets, verification evidence and complete Corresponding Source availability before publishing.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "Phyra $GITHUB_REF_NAME" --notes-file release-notes.md
