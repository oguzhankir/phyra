name: Prepare a verified release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-metadata.mjs
      - name: Require reviewed public distribution readiness
        env:
          DISTRIBUTION_READY: ${{ vars.PHYRA_PUBLIC_DISTRIBUTION_READY }}
        run: |
          if [ "$DISTRIBUTION_READY" != "true" ]; then
            echo "::error::Public distribution is gated. Complete target-specific redistribution/Corresponding Source, installation and trust review before the owner enables PHYRA_PUBLIC_DISTRIBUTION_READY."
            exit 1
          fi
  verified-builds:
    needs: readiness
    uses: ./.github/workflows/ci.yml
    with:
      # Source-only releases still verify every supported CI target. Installer
      # staging stays disabled until all native source and redistribution audits pass.
      release_assets: false
      verify_all_targets: true
  draft:
    needs: verified-builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source-only draft with curated release notes and CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v target="## $version" '
            $0 == target || index($0, target " (") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Verification and distribution

          This source-only draft contains no installers or installer checksum files. The exact tag passed scientific, native and packaged desktop checks on the five configured CI targets. Build locally using README.md and CONTRIBUTING.md. Hosted checks do not replace consumer installation, minimum-OS or production signing review.

          Installer distribution remains disabled until target-specific native dependency audits, exact source provenance and complete Corresponding Source review pass.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Phyra $GITHUB_REF_NAME" --notes-file release-notes.md
